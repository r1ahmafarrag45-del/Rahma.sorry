<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنا آسفة...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fcf8f7; 
            color: #5a4b41; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            border: 1px solid #f0e1dc;
        }
        h1 {
            color: #d1a3a4; 
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .heart {
            color: #d1a3a4;
            font-size: 40px;
            animation: beat 1.2s infinite;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart">🌸</div>
        <h1>أنا آسفة جداً...</h1>
        <p>
         حبيت أعتذر لك بطريقة مختلفة ومخصوصة . <br>
            مكانش قصدي أبداً أضايقك أو أزعلك.. والعيد داخل علينا مش عاوزه نكون مضايقين من بعض لو مش عاوز ترد ابعلي بس علامه صح اي حاجه وابقي كلمني او رد عليا وفهمني يااحمد ..  🤍
        </p>
        <div class="heart">✨</div>
    </div>

</body>
</html>
