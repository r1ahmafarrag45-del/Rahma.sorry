<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أنا آسفه</title>

<style>
body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#fff0f5);
font-family:Arial;
overflow:hidden;
}

.box{
background:white;
padding:40px;
border-radius:25px;
text-align:center;
width:80%;
max-width:400px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
color:#ff4f81;
font-size:40px;
}

p{
font-size:22px;
line-height:1.8;
color:#444;
}

button{
background:#ff4f81;
color:white;
border:none;
padding:15px 25px;
border-radius:15px;
font-size:18px;
margin-top:15px;
}

.heart{
position:absolute;
top:-20px;
font-size:24px;
animation:fall 5s linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}
</style>
</head>

<body>

<div class="box">
<h1>أنا آسفه 💗</h1>

<p>
متزعلش مني...<br>
يومي وحش من غيرك<br><br>
أنت أغلى حد عندي
</p>

<button>سامحيني؟</button>
</div>

<script>
function createHeart(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💗";
heart.style.left=Math.random()*100+"vw";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
